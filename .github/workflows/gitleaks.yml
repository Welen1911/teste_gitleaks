name: gitleaks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD":/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner -v --exit-code 1
